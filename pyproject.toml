[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanno-work"
version = "0.1.0"
description = "A benchmark-independent runtime for professional workflow environments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fanno-work = "fanno_work.cli:main"
fanno-tool = "fanno_work.gateway.cli:main"
fanno-control = "fanno_work.gateway.control_cli:main"

[tool.setuptools.packages.find]
where = ["src"]