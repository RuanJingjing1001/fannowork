        locator: instructions
        quote: "Review the attached law firm invoice against our billing guidelines and related correspondence"
        sha256: 8f9f7eab6e276a40dcf91c2d373cf4e8855b65f0db99ac7e6f3aebc3f19a650b
    unknowns:
      - The source does not prescribe a mandatory order for opening the six files.

  - step_id: extract_rules_and_context
    professional_operation: Extract billing rules, engagement context, prior notice, prior-month work, and related-matter work.
    required_actions:
      - document.extract_text
      - email.read_eml
    inputs:
      - billing_guidelines
      - engagement_letter
      - prior_month_invoice_summary
      - related_matter_summary
      - research_cap_email
    outputs:
      - governing_rules
      - comparison_evidence
      - approval_and_notice_evidence
    dependencies:
      - inventory_source_materials
    dependency_status: design_decision
    side_effect: read_only
    provenance: source_confirmed
    evidence:
      - source_path: legal/tasks/reference/representative-180-v0.1/sources/harvey-lab/identify-excessive-or-duplicative-research-charges-in-litigation-invoice/task.json
        locator: criteria C-001 through C-046
        quote: "against our billing guidelines and related correspondence"
        sha256: 8f9f7eab6e276a40dcf91c2d373cf4e8855b65f0db99ac7e6f3aebc3f19a650b
    unknowns: []

  - step_id: inspect_invoice_workbook
    professional_operation: Inspect workbook structure and read invoice summary, fee entries, disbursements, and discount data.
    required_actions:
      - spreadsheet.inspect_workbook
      - spreadsheet.read_range
      - spreadsheet.find
    inputs:
      - july_invoice
    outputs:
      - invoice_summary
      - fee_entries
      - disbursement_entries
      - discount_data
    dependencies:
      - inventory_source_materials
    dependency_status: design_decision
    side_effect: read_only
    provenance: implementation_confirmed
    evidence:
      - source_path: legal/tasks/reference/representative-180-v0.1/sources/harvey-lab/identify-excessive-or-duplicative-research-charges-in-litigation-invoice/documents/hl-july-2024-invoice.xlsx
        locator: workbook sheet XML; sheets Summary, Fee Detail, Disbursements, Discount
        quote: null
        sha256: 04be162ba4f1a616682638d0aaa03348f776147c5a7bf5a69fd6fd8bba010145
    unknowns:
      - The workbook contains no stored formulas; calculations must use displayed source values and independent decimal arithmetic.

  - step_id: identify_supported_billing_issues
    professional_operation: Compare invoice entries with governing rules and comparison evidence to identify supported violations, duplication, excess, and arithmetic errors.
    required_actions:
      - spreadsheet.find
      - document.extract_text
      - email.read_eml
    inputs:
      - governing_rules
      - comparison_evidence
      - approval_and_notice_evidence
      - invoice_summary
      - fee_entries
      - disbursement_entries
      - discount_data
    outputs:
      - supported_issue_candidates
    dependencies:
      - extract_rules_and_context
      - inspect_invoice_workbook
    dependency_status: rule_inferred
    side_effect: read_only
    provenance: source_confirmed
    evidence:
      - source_path: legal/tasks/reference/representative-180-v0.1/sources/harvey-lab/identify-excessive-or-duplicative-research-charges-in-litigation-invoice/task.json
        locator: instructions
        quote: "identifying all non-compliant or excessive charges"
        sha256: 8f9f7eab6e276a40dcf91c2d373cf4e8855b65f0db99ac7e6f3aebc3f19a650b
    unknowns:
      - The upstream rubric permits judgment for several duplication adjustments rather than one unique amount.

  - step_id: calculate_recommended_adjustments
    professional_operation: Calculate supported adjustment amounts and an arithmetically consistent consolidated reduction.
    required_actions:
      - calculation.evaluate_decimal
    inputs:
      - supported_issue_candidates
      - invoice_summary
      - fee_entries
      - disbursement_entries
      - discount_data
    outputs:
      - recommended_adjustments
      - adjustment_total
    dependencies:
      - identify_supported_billing_issues
    dependency_status: rule_inferred
    side_effect: read_only
    provenance: source_confirmed
    evidence:
      - source_path: legal/tasks/reference/representative-180-v0.1/sources/harvey-lab/identify-excessive-or-duplicative-research-charges-in-litigation-invoice/task.json
        locator: instructions and criteria C-002, C-003, C-006, C-009, C-012, C-015, C-019, C-023, C-027, C-030, C-031, C-043, C-044, C-045
        quote: "with recommended adjustments"
        sha256: 8f9f7eab6e276a40dcf91c2d373cf4e8855b65f0db99ac7e6f3aebc3f19a650b
    unknowns:
      - Overlapping violations require a documented non-double-counting policy before one canonical total can be enforced.

  - step_id: create_review_memo
    professional_operation: Create a formal DOCX memo that explains supported issues, cites evidence, prioritizes severity, and consolidates recommended adjustments.
    required_actions:
      - document.create
      - document.insert_heading
      - document.insert_paragraph
      - document.add_table
      - document.save_as
    inputs:
      - supported_issue_candidates
      - recommended_adjustments
      - adjustment_total
    outputs:
      - research_charge_review_memo
    dependencies:
      - calculate_recommended_adjustments
    dependency_status: design_decision
    side_effect: create_artifact
    provenance: source_confirmed
    evidence:
      - source_path: legal/tasks/reference/representative-180-v0.1/sources/harvey-lab/identify-excessive-or-duplicative-research-charges-in-litigation-invoice/task.json
        locator: instructions, deliverables, criteria C-037, C-038 and C-043
        quote: "prepare a memo identifying all non-compliant or excessive charges with recommended adjustments"
        sha256: 8f9f7eab6e276a40dcf91c2d373cf4e8855b65f0db99ac7e6f3aebc3f19a650b
    unknowns:
      - Narrative clarity and professional usefulness are only partly deterministic.

