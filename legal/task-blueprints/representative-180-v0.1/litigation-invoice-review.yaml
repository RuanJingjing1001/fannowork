unknowns:
  - id: adjustment_overlap_policy
    value: Several source criteria permit flexible adjustments, and some violations may overlap the same time entries.
    impact: A fixed expected total could reward double counting or reject a defensible adjustment methodology.
    status: open

  - id: narrative_quality_checker
    value: Professional memo clarity, prioritization, and reasoning quality are not fully captured by deterministic string and arithmetic checks.
    impact: A trusted hybrid checker or human review rubric may still be needed.
    status: open

  - id: source_material_rights_scope
    value: The repository declares MIT, but individual task-material provenance has not been independently audited beyond the repository license.
    impact: Public redistribution of a derivative task should wait for a material-level rights review.
    status: open

  - id: spreadsheet_rendering_requirements
    value: The workbook contains no formulas, but visual formatting or merged-cell semantics have not yet been inspected through LibreOffice Calc UNO.
    impact: The minimum SpreadsheetCapability contract may change after the real Calc integration probe.
    status: open

