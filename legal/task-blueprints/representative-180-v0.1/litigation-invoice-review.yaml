professional_goal:
  value: Review a law-firm litigation invoice against billing guidelines and related correspondence, identify non-compliant or excessive research charges, and recommend monetary adjustments in a formal memo.
  provenance: source_confirmed
  evidence:
    - source_path: legal/tasks/reference/representative-180-v0.1/sources/harvey-lab/identify-excessive-or-duplicative-research-charges-in-litigation-invoice/task.json
      locator: instructions
      quote: "Review the attached law firm invoice against our billing guidelines and related correspondence, and prepare a memo identifying all non-compliant or excessive charges with recommended adjustments."
      sha256: 8f9f7eab6e276a40dcf91c2d373cf4e8855b65f0db99ac7e6f3aebc3f19a650b
  notes:
    - The source task is a bounded document-review exercise, not a live outside-counsel billing system.

agent_contract:
  public_prompt: >-
    Review the attached law firm invoice against the billing guidelines and
    related correspondence. Prepare a memo identifying all supported
    non-compliant, duplicative, or excessive research charges and recommend
    supported monetary adjustments. Save the result as
    output/research-charge-review-memo.docx.
  must_do:
    - Inspect the July 2024 invoice and all five supporting materials.
    - Connect every recommended adjustment to invoice evidence and a governing billing rule or supported comparison.
    - Calculate and consolidate recommended monetary adjustments.
    - Produce one DOCX review memo in the output directory.
    - Preserve every input file unchanged.
  must_not_expose:
    - hidden expected findings and amounts from this blueprint
    - upstream criteria text or identifiers
    - evaluator implementation and reward weights
    - reference answers
  provenance: design_decision
  evidence:
    - source_path: legal/tasks/reference/representative-180-v0.1/sources/harvey-lab/identify-excessive-or-duplicative-research-charges-in-litigation-invoice/task.json
      locator: instructions and deliverables
      quote: "Output: `research-charge-review-memo.docx`."
      sha256: 8f9f7eab6e276a40dcf91c2d373cf4e8855b65f0db99ac7e6f3aebc3f19a650b

